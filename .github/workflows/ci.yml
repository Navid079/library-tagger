name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: cargo test --manifest-path native/Cargo.toml
      - run: npm run test:integration
      - run: npm run build
      - run: xvfb-run -a node scripts/electron-smoke.mjs
      - run: npm run package:linux:test
